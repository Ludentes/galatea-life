# The installation's broker (the install-core design, *TLS inside the stack*, *The broker's access
# rules*). MQTT 5 is Mosquitto 2's default. broker-init.sh writes the password and access files, and
# copies the key, at each start.
# mqtts only, from the installation's CA; no plain listener. Clients authenticate by password, over TLS.
listener 8883
cafile /run/tls/ca.pem
certfile /run/tls/broker.pem
keyfile /mosquitto/run/broker.key
require_certificate false
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl
# The ClientID is the identity: a second client under a name takes the first one's session over, visibly.
use_username_as_clientid true
# Retained statuses and rosters survive a restart of the broker.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# A refused CONNECT is in the log.
connection_messages true
