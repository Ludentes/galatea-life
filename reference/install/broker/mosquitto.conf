# The installation's broker (plan 4a). MQTT 5 is Mosquitto 2's default.
# broker-init.sh writes the password and access files at each start.
listener 1883
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl
# Retained statuses and rosters survive a restart of the broker.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
