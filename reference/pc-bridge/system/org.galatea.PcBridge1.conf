<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The Galatea PC bridge's helper endpoint on the system bus (GA-BRIDGE-61, GA-BRIDGE-64).
  Installed as /usr/share/dbus-1/system.d/org.galatea.PcBridge1.conf.
-->
<busconfig>
  <!-- Only root, the bridge's service, owns the endpoint's name: no other process can bind it. -->
  <policy user="root">
    <allow own="org.galatea.PcBridge1"/>
    <!-- The service asks a helper to show a notification by calling the helper's own object. -->
    <allow send_type="method_call" send_interface="org.galatea.PcBridge1.Helper"/>
  </policy>
  <!-- Any account may call the endpoint's interface (its helpers are its sessions' accounts), and nothing else of it. -->
  <policy context="default">
    <allow send_destination="org.galatea.PcBridge1" send_interface="org.galatea.PcBridge1" send_type="method_call"/>
  </policy>
</busconfig>
